<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact Dasari Kavya for collaboration, project opportunities and professional inquiries.">

    <meta name="author" content="Dasari Kavya">

    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Contact | Dasari Kavya">
    <meta property="og:description"
        content="Get in touch with Dasari Kavya.">
    <meta property="og:type" content="website">

    <title>Contact | Dasari Kavya</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <a href="#main-content" class="skip-link">
        Skip to main content
    </a>

    <header>

        <nav aria-label="Main navigation">

            <a href="index.html" aria-label="Go to homepage">
                Dasari Kavya
            </a>

            <ul>

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="projects.html">Projects</a>
                </li>

                <li>
                    <a href="contact.html" aria-current="page">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>

    <main id="main-content">

        <section aria-labelledby="contact-heading">

            <h1 id="contact-heading">Contact Me</h1>

            <p>
                If you would like to connect with me, please
                fill out the form below.
            </p>

            <form
                action="#"
                method="post"
                aria-label="Contact form">

                <div>

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true">

                </div>

                <br>

                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true">

                </div>

                <br>

                <div>

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                        aria-required="true">

                </div>

                <br>

                <div>

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        aria-required="true"></textarea>

                </div>

                <br>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 Dasari Kavya. All rights reserved.
        </p>

    </footer>

</body>

</html>
